[package]
name = "seihai-listserver"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A Graal listserver: gives classic clients (2.00 to 2.31), Seihai and RCs their server list, and lets gservers register and verify accounts."
repository = "https://github.com/squirelworks/seihai-listserver"
publish = false

[dependencies]
# Protocol, framing, version profiles and scripting shared with the Seihai client.
# TODO(tag): rev of squirelworks/seihai PR "secure-gserver-link" (encrypted link).
# Once that PR is merged and tagged (v0.0.5), switch to `tag = "v0.0.5"`.
seihai-core = { git = "https://github.com/squirelworks/seihai", rev = "637ade305d525e7ff307ea95cfa2b42674bfd857", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
argon2 = { version = "0.5", features = ["std"] }

[dev-dependencies]
tempfile = "3"

# argon2 is very slow unoptimised; the tests hash and check passwords.
[profile.dev.package."*"]
opt-level = 2

[package]
name = "seihai-listserver"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A Graal listserver: gives classic clients (1.41 to 3.x), Seihai and RCs their server list, and lets gservers register and verify accounts."
repository = "https://github.com/squirelworks/seihai-listserver"
publish = false

[dependencies]
# Protocol, framing, version profiles and scripting shared with the Seihai client.
seihai-core = { git = "https://github.com/squirelworks/seihai-core", rev = "dd6c88eb2e2ff4fc3177c4038869bdc4e580a132", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
argon2 = { version = "0.5", features = ["std"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

# argon2 is very slow unoptimised; the tests hash and check passwords.
[profile.dev.package."*"]
opt-level = 2

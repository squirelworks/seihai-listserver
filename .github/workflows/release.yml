name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: seihai-listserver-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: seihai-listserver-windows-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: seihai-listserver-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: seihai-listserver-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist/${{ matrix.name }}
          cp target/${{ matrix.target }}/release/seihai-listserver README.md LICENSE-MIT LICENSE-APACHE dist/${{ matrix.name }}/
          tar czf ${{ matrix.name }}.tar.gz -C dist ${{ matrix.name }}
      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force dist/${{ matrix.name }}
          Copy-Item target/${{ matrix.target }}/release/seihai-listserver.exe,README.md,LICENSE-MIT,LICENSE-APACHE dist/${{ matrix.name }}/
          Compress-Archive -Path dist/${{ matrix.name }} -DestinationPath ${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "seihai-listserver ${TAG#v}" --notes ""
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*

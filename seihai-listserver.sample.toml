# seihai-listserver settings. Every key is optional; these are the defaults.
# Run with: seihai-listserver --config seihai-listserver.toml

# Address to listen on. 127.0.0.1: only this machine (a lab).
# "0.0.0.0": every interface, to host for other machines (see the README,
# "Hosting for other machines").
bind = "127.0.0.1"

# Port gservers register on. When hosting, open it only to your gservers.
gserver_port = 14900

# Which gservers may register. Empty (the default): any link to
# gserver_port may register. When set, other addresses are dropped, and a
# server is listed only after SERVERHQPASS matches hq_password. That
# password is the raw rest of the SERVERHQPASS line, sent before NEWSERVER.
# gservers = [{ ip = "127.0.0.1", hq_password = "change-me" }]

# Ports clients ask for the list on. Every port answers every login shape
# (2.00/2.05, 2.17, 2.19-2.21, 2.22/2.31, 3.x and the RC list).
client_ports = [14921, 14922, 14923]

# Name of the list, used in the status text.
list_name = "Lab listserver"

# Status text after a login. {list}, {account} and {servers} are filled in.
status = "Welcome to {list}, {account}.\nThere are {servers} server(s) online."

# Site and upgrade URLs sent to 2.22 and later. Empty unless you set them.
site_url = ""
upgrade_url = ""

# Accounts file, made with `seihai-listserver add-account FILE ACCOUNT`.
# Empty: open mode, every account and password gets in.
# A relative path is taken from this file's folder.
accounts = ""

# Also write the log here. Empty: standard error only.
log_file = ""

# Address the list shows for each gserver: "peer" (where its link comes
# from) or "sent" (what the gserver says; "peer" when it says AUTO).
gserver_ip = "peer"

# Most links open at once, and how long a silent link stays open (seconds).
max_connections = 256
client_timeout_secs = 30
gserver_timeout_secs = 300

# Real 1.41 rev 1 connects and waits for the list. After this many
# milliseconds with no byte, send the shape A reply (id 0 list, id 2
# status). 0: off. A client that speaks first is never answered early.
silent_list_after_ms = 0

# Failed client logins and failed VERIACC2 checks from one address, counted
# apart, inside login_fail_window_secs. The next guess is refused without
# checking the password. 0 on either setting: no cap.
login_fail_limit = 30
login_fail_window_secs = 60

# Log how many servers and players are listed, every this many seconds.
# 0: off. The config file is read again when it changes. On Unix, SIGHUP
# reloads it too. The bind address and ports stay until a restart.
status_log_secs = 300

# The Seihai secure login (version token SEI00001): Seihai clients started
# with --secure-login send the account and password encrypted. This is the
# file with the listserver's own key; it is made on first start, and the
# fingerprint is printed in the log so players can check it. Keep it
# private and back it up: a new key makes every player see a changed key.
# Empty: secure logins are refused. A relative path is taken from this
# file's folder.
secure_login_key = "seihai-login.key"

# Refuse accounts and passwords sent in the clear (classic logins). Real
# Graal clients cannot log in when this is on.
require_secure_login = false

# Seihai gservers encrypt their link to the listserver (it carries every
# player's password when the gserver checks an account), with the same key
# as above. Refuse plain links: GServer-v2 and the GPL fork cannot register
# when this is on.
require_secure_gserver_link = false
